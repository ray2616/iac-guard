name: iac-guard
x-app: &app
  image: iac-guard:0.1.0
  environment: &environment
    DATABASE_URL: postgresql+psycopg://iac:${POSTGRES_PASSWORD:-local-development}@postgres:5432/iac_guard
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    STORAGE_PATH: /data/objects
    S3_BUCKET: ${S3_BUCKET:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-true}
    CHECKOV_SKIP_PLATFORM_DOWNLOAD: "true"
  volumes:
    - artifacts:/data/objects
    - scanner_cache:/cache/trivy
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: iac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
      POSTGRES_DB: iac_guard
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U iac -d iac_guard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.1-bookworm
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    build: .
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
  dispatcher:
    <<: *app
    command: [python, -m, iac_guard.service.dispatcher]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: [python, -m, iac_guard.service.jobs]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 1.5
  ui:
    <<: *app
    command: [python, -m, streamlit, run, app.py, --server.address, 0.0.0.0, --server.headless, "true"]
    environment:
      IAC_API_URL: http://api:8000
    volumes: []
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  artifacts:
  scanner_cache:
